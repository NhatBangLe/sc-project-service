services:
  mysql:
    image: mysql:8.1
    container_name: project-db
    ports:
      - "2706:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: sc_project
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 15s
      timeout: 15s
      retries: 3
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - network
  project-service:
    image: nhatbangle/sc-project:latest
    container_name: project-service
    ports:
      - "80:8080"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROFILE_ACTIVE: test
      DB_HOST: mysql:3306
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: sc_project
      FILE_SERVICE_URL: localhost:8081
      USER_SERVICE_URL: localhost:8082
      SWAGGER_SERVER_URL: http://gateway:80
    volumes:
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    networks:
      - network
volumes:
  logs:
    name: project-logs
  db-data:
    name: project-db
networks:
  network:
    name: project-network